<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Planner テスト</title>
  <style>
    body { font: 13px/1.6 ui-monospace, Menlo, monospace; padding: 16px; }
    .fail { color: #c0392b; font-weight: bold; }
    .ok { color: #2a9a66; }
  </style>
</head>
<body>
  <h1 id="summary">実行中…</h1>
  <pre id="log"></pre>
  <script>
    // 実データとは別の保存先を使う（アプリ本体の予定・メモには触れない）
    globalThis.PLANNER_NS = 'planner-test';
    for (const s of [localStorage, sessionStorage]) {
      Object.keys(s).filter(k => k.startsWith('planner-test.')).forEach(k => s.removeItem(k));
    }
  </script>
  <script type="module" src="js/tests.js"></script>
</body>
</html>
